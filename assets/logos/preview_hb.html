<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>HB 字标方案 · 链接全球</title>
<style>
  body{margin:0;background:#0a0e1a;color:#e8edf6;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;padding:40px 20px;}
  h1{text-align:center;font-weight:800;letter-spacing:1px;margin:0 0 6px;}
  p.sub{text-align:center;color:#9fb0c8;margin:0 0 36px;font-size:14px;}
  .grid{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
  .card{background:#11182b;border:1px solid #1f2c47;border-radius:16px;padding:22px;text-align:center;}
  .card img{width:200px;height:200px;border-radius:50%;background:#0a0e1a;}
  .card .name{margin-top:16px;font-weight:700;color:#ffce6a;font-size:16px;}
  .card .desc{margin-top:8px;color:#aab8cf;font-size:13px;line-height:1.6;}
  .foot{text-align:center;color:#7c8aa3;font-size:12px;margin-top:40px;}
  @media(max-width:720px){.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
  <h1>HB 创意字标 · 链接全球</h1>
  <p class="sub">HuiBang / 惠帮 — 用 H·B 两个字母表达"连接全球供应链"</p>
  <div class="grid">
    <div class="card">
      <img src="./hba_globe.svg"/>
      <div class="name">A · 经纬地球</div>
      <div class="desc">HB 叠在地球经纬线上，十字节点=全球连接点。稳重、可信，最适合作官网/正式头像。</div>
    </div>
    <div class="card">
      <img src="./hbb_orbit.svg"/>
      <div class="name">B · 轨道环绕</div>
      <div class="desc">HB 居中，地球轨道环+光点绕行，寓意 HB 触达全球。现代、国际感强，海外社媒首选。</div>
    </div>
    <div class="card">
      <img src="./hbc_network.svg"/>
      <div class="name">C · 全球网络</div>
      <div class="desc">HB 嵌在连线网络里，弧线=跨国链路。强调"网络/履约通道"，科技感、连接感最强。</div>
    </div>
  </div>
  <p class="foot">透明背景 · 圆形裁切做头像即清晰 · 源文件在 assets/logos/</p>
</body>
</html>
